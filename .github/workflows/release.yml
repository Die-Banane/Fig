# Builds a major version: Fig as one file per platform (the app, .NET and FFmpeg inside), published
# as a GitHub release:
#   Fig-<v>-linux-x64              run it; it adds itself to the app menu (Fig --uninstall takes it out)
#   Fig-<v>-win-x64-setup.exe      installer: Start menu, uninstaller, no admin needed
#   Fig-<v>-win-x64.exe            the same Fig.exe, portable
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# Only vN.0.0 tags start it. Run it by hand from the Actions tab to build any version.
name: Release

on:
  push:
    tags: ['v[0-9]+.0.0']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the v (e.g. 2.0.0)
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: 10.0.x
  # FFmpeg 8.1 shared, GPL (libx264 is needed for export and proxies; Fig is GPLv3)
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  FFMPEG_NAME: ffmpeg-n8.1-latest
  FFMPEG_SUFFIX: gpl-shared-8.1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$v' is not a version like 2.0.0"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            ffmpeg: linux64
          - rid: win-x64
            os: windows-latest
            ffmpeg: win64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: Fig-${{ needs.version.outputs.version }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # only the libraries Fig calls (no avfilter / avdevice), as real files: the release carries them inside
      - name: FFmpeg
        run: |
          base="$FFMPEG_NAME-${{ matrix.ffmpeg }}-$FFMPEG_SUFFIX"
          mkdir ffmpeg-libs
          if [ "${{ matrix.ffmpeg }}" = win64 ]; then
            curl -fsSL -o ff.zip "$FFMPEG_URL/$base.zip"
            unzip -q ff.zip
            for lib in avutil avcodec avformat swscale swresample; do cp "$base"/bin/$lib-*.dll ffmpeg-libs/; done
          else
            curl -fsSL "$FFMPEG_URL/$base.tar.xz" | tar xJ
            for lib in avutil avcodec avformat swscale swresample; do
              cp -L "$(ls "$base"/lib/lib$lib.so.* | grep -E "lib$lib\.so\.[0-9]+$")" ffmpeg-libs/
            done
          fi
          cp "$base"/LICENSE.txt FFMPEG-LICENSE.txt
          ls -l ffmpeg-libs
      # pwd -W: a Windows path for the Windows tools (Git Bash's own /d/a/... means nothing to them)
      - name: Publish
        run: |
          here=$(pwd -W 2>/dev/null || pwd)
          dotnet publish src/Fig.App/Fig.App.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version=$VERSION -p:DebugType=none -p:FfmpegDir="$here/ffmpeg-libs" -o publish
      - name: Package
        run: |
          mkdir dist
          if [ "${{ matrix.ffmpeg }}" = win64 ]; then
            cp publish/Fig.App.exe "dist/$OUT.exe"
            cp FFMPEG-LICENSE.txt packaging/windows/
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            [ -f "$iscc" ] || { choco install innosetup -y --no-progress > /dev/null; }
            here=$(pwd -W)
            # no Git Bash path rewriting: ISCC's /D options must arrive as written
            MSYS_NO_PATHCONV=1 "$iscc" /Q /DVersion=$VERSION /DSource="$here/publish/Fig.App.exe" /DOutput="$here/dist" packaging/windows/Fig.iss
          else
            cp publish/Fig.App "dist/$OUT"
            chmod +x "dist/$OUT"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        run: |
          cd dist
          sha256sum Fig-* > SHA256SUMS
          gh release create "v$VERSION" Fig-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fig $VERSION" --generate-notes
